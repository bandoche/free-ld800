<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>Free LD-800</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f8ff;
      --muted: #9badc5;
      --line: rgba(255,255,255,.10);
      --blue: #5aa7ff;
      --cyan: #6ee7f5;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: max(28px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom));
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 10%, rgba(90,167,255,.25), transparent 34rem),
        radial-gradient(circle at 92% 88%, rgba(110,231,245,.14), transparent 28rem),
        #08111f;
    }
    main { width: min(680px, 100%); }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin: 0 0 18px 4px;
    }
    .brand::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 18px var(--cyan);
    }
    .card {
      overflow: hidden;
      padding: clamp(30px, 7vw, 58px);
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(24,39,63,.94), rgba(11,23,40,.96));
      box-shadow: 0 30px 90px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.05);
    }
    .icon {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin-bottom: 26px;
      border-radius: 22px;
      font-size: 37px;
      background: linear-gradient(145deg, rgba(90,167,255,.24), rgba(110,231,245,.10));
      border: 1px solid rgba(110,231,245,.28);
    }
    h1 { margin: 0; font-size: clamp(36px, 8vw, 60px); line-height: 1.02; letter-spacing: -.045em; }
    p { margin: 20px 0 32px; color: var(--muted); font-size: clamp(17px, 3.6vw, 21px); line-height: 1.65; }
    .launch {
      display: flex;
      min-height: 68px;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      border-radius: 18px;
      color: #04111d;
      background: linear-gradient(120deg, var(--cyan), var(--blue));
      text-decoration: none;
      font-size: 21px;
      font-weight: 850;
      box-shadow: 0 16px 36px rgba(65,158,255,.24);
      transition: transform .15s ease, filter .15s ease;
      touch-action: manipulation;
    }
    .launch:active { transform: scale(.985); filter: brightness(.92); }
    .launch span { font-size: 25px; }
    .note { margin: 18px 2px 0; text-align: center; color: #71849f; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Free LD-800</div>
    <section class="card">
      <div class="icon" aria-hidden="true">⚙️</div>
      <h1>Android 설정 열기</h1>
      <p>LD-800의 기본 Android 설정 화면을 엽니다. 깨끗하게 시작된 브라우저에서 한 번만 실행하세요.</p>
      <a class="launch"
         href="settings.html?pay=run&amp;p=z_ldk152&amp;steps=14000&amp;v=15200"
         onclick="location.href='settings.html?pay=run&amp;p=z_ldk152&amp;steps=14000&amp;v='+Date.now();return false;">
        <span aria-hidden="true">↗</span> 설정 열기
      </a>
      <div class="note">실행 후 잠시 기다리면 설정 앱이 표시됩니다.</div>
    </section>
  </main>
</body>
</html>
